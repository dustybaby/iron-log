<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>IRON LOG — Workout Tracker</title>
<meta name="description" content="Home strength training tracker — streaks, PRs, and a daruma goal ritual.">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IronLog">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --ink:#15171c;
  --panel:#1e2128;
  --panel-raised:#262a33;
  --line:#33373f;
  --chalk:#edeae2;
  --smoke:#8b8f99;
  --plate:#e0562f;
  --plate-dim:#7a3524;
  --gold:#e8b93f;
  --teal:#4fa98c;
  --blue:#5c7cfa;
  --done-bg:#26312c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 80px;}

/* HEADER */
.header{margin-bottom:18px;display:flex;gap:14px;align-items:flex-start;}
.header-text{flex:1;}
.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--smoke);
  text-transform:uppercase;
  margin-bottom:6px;
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:38px;
  letter-spacing:.01em;
  text-transform:uppercase;
  margin:0 0 4px;
  line-height:1;
}
h1 span{color:var(--plate);}
.subhead{color:var(--smoke);font-size:13.5px;}
.next-up{
  margin-top:10px;
  font-size:12.5px;
  color:var(--chalk);
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--plate);
  padding:9px 12px;
  border-radius:6px;
  font-family:'Space Mono',monospace;
}
.next-up b{color:var(--plate);}
.header-daruma{flex-shrink:0;width:52px;height:62px;}

.install-btn{
  width:100%;margin-bottom:16px;padding:11px;border-radius:8px;
  background:var(--panel);border:1px solid var(--plate);color:var(--plate);
  font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
.install-btn svg{width:16px;height:16px;}

/* QUOTE */
.quote-card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin:16px 0;display:flex;align-items:center;gap:12px;
}
.quote-text{
  flex:1;font-family:'Oswald',sans-serif;font-weight:400;font-size:15px;
  font-style:italic;line-height:1.35;color:var(--chalk);
}
.quote-shuffle{
  flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--panel-raised);
  border:1px solid var(--line);color:var(--smoke);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.quote-shuffle svg{width:15px;height:15px;}
.quote-shuffle:active{transform:rotate(90deg);}

/* STATS */
.stats{display:flex;gap:8px;margin:16px 0;}
.stat{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:10px 8px;text-align:center;
}
.stat svg{width:16px;height:16px;margin-bottom:4px;}
.stat .num{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;line-height:1;}
.stat .lbl{
  font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--smoke);margin-top:3px;
}
.stat.streak svg{fill:var(--plate);}
.stat.sessions svg{fill:var(--teal);}
.stat.week svg{fill:var(--blue);}

/* HEATMAP */
.heatmap-card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px 14px;margin-bottom:18px;overflow-x:auto;
}
.heatmap-title{
  font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--smoke);margin-bottom:8px;
}
.heatmap-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7, 11px);gap:3px;width:max-content;}
.hm-cell{width:11px;height:11px;border-radius:2px;background:var(--panel-raised);border:1px solid rgba(255,255,255,.03);}
.hm-cell.l1{background:#4a2c22;}
.hm-cell.l2{background:var(--plate-dim);}
.hm-cell.l3{background:var(--plate);}
.hm-cell.today{outline:1.5px solid var(--chalk);outline-offset:1px;}
.heatmap-legend{display:flex;align-items:center;gap:5px;margin-top:8px;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--smoke);}
.heatmap-legend .hm-cell{width:9px;height:9px;}

/* DARUMA GOAL CARD */
.daruma-card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px;margin-bottom:18px;display:flex;gap:14px;align-items:flex-start;
}
.daruma-card .daruma-icon{flex-shrink:0;width:64px;height:76px;}
.daruma-body{flex:1;min-width:0;}
.daruma-title{
  font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--smoke);margin-bottom:8px;
}
.daruma-goal-text{
  font-family:'Oswald',sans-serif;font-size:16px;font-weight:500;color:var(--chalk);
  margin-bottom:6px;line-height:1.3;
}
.daruma-sub{font-size:12px;color:var(--smoke);margin-bottom:10px;line-height:1.4;}
.daruma-input{
  width:100%;background:var(--panel-raised);border:1px solid var(--line);color:var(--chalk);
  border-radius:6px;padding:9px 11px;font-size:13.5px;font-family:'Inter',sans-serif;margin-bottom:10px;
}
.daruma-input::placeholder{color:#5c6169;}
.daruma-btn{
  padding:9px 14px;border-radius:6px;border:none;cursor:pointer;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;
}
.daruma-btn.left{background:var(--plate);color:var(--ink);}
.daruma-btn.right{background:var(--gold);color:var(--ink);}
.daruma-btn.reset{background:var(--panel-raised);color:var(--chalk);border:1px solid var(--line);}
.daruma-history{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.daruma-history-item{font-size:11.5px;color:var(--smoke);margin:3px 0;font-family:'Space Mono',monospace;}
.daruma-history-item b{color:var(--gold);}

/* DAY TABS */
.tabs{display:flex;gap:8px;margin:0 0 16px;}
.tab{
  flex:1;background:var(--panel);border:1px solid var(--line);color:var(--smoke);
  font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;
  text-transform:uppercase;padding:12px 6px;border-radius:6px;cursor:pointer;text-align:center;
  transition:all .15s ease;position:relative;
}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;position:relative;top:-1px;}
.tab[data-day="Sunday"] .dot{background:var(--plate);}
.tab[data-day="Tuesday"] .dot{background:var(--teal);}
.tab[data-day="Friday"] .dot{background:var(--blue);}
.tab.active{color:var(--chalk);border-color:var(--chalk);}
.tab.today::after{
  content:"TODAY";position:absolute;top:-8px;right:6px;font-family:'Space Mono',monospace;
  font-size:8px;letter-spacing:.1em;background:var(--plate);color:var(--ink);padding:2px 5px;
  border-radius:3px;font-weight:700;
}

/* PROGRESS */
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.progress-track{flex:1;height:9px;background:var(--panel);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--plate-dim),var(--plate));width:0%;transition:width .35s ease;border-radius:5px;}
.progress-fill.full{background:linear-gradient(90deg,var(--teal),#6fd1ae);}
.progress-label{font-family:'Space Mono',monospace;font-size:12px;color:var(--smoke);white-space:nowrap;}

/* EXERCISE LIST */
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;transition:background .15s ease, border-color .15s ease;}
.ex.done{background:var(--done-bg);border-color:#3a5545;}
.ex-top{display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
.checkbox{
  flex-shrink:0;width:24px;height:24px;border-radius:6px;border:2px solid var(--smoke);margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:all .15s ease;
}
.ex.done .checkbox{background:var(--teal);border-color:var(--teal);}
.checkbox svg{width:14px;height:14px;opacity:0;transition:opacity .1s ease;}
.ex.done .checkbox svg{opacity:1;}
.ex-name-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.ex-name{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;text-transform:uppercase;letter-spacing:.01em;line-height:1.25;}
.ex.done .ex-name{color:var(--smoke);text-decoration:line-through;text-decoration-color:#4a5a52;}
.pr-chip{
  font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;background:var(--gold);
  color:var(--ink);padding:2px 6px;border-radius:4px;letter-spacing:.04em;
}
.ex-target{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--plate);margin-top:2px;}
.ex.done .ex-target{color:var(--smoke);}
.ex-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.field label{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--smoke);text-transform:uppercase;margin-bottom:4px;}
.field input{
  width:100%;background:var(--panel-raised);border:1px solid var(--line);color:var(--chalk);
  border-radius:5px;padding:8px 9px;font-size:13.5px;font-family:'Inter',sans-serif;
}
.field input::placeholder{color:#5c6169;}
.field input:focus{outline:none;border-color:var(--teal);}

/* ACTIONS */
.actions{display:flex;gap:10px;position:sticky;bottom:14px;margin-top:6px;}
.btn{
  flex:1;padding:14px;border-radius:8px;border:none;font-family:'Oswald',sans-serif;font-weight:600;
  font-size:15px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
}
.btn-save{background:var(--plate);color:var(--ink);box-shadow:0 4px 18px rgba(224,86,47,.35);}
.btn-save:active{transform:scale(.98);}
.btn-history{background:var(--panel);color:var(--chalk);border:1px solid var(--line);}

/* HISTORY */
.history{display:none;flex-direction:column;gap:10px;margin-top:6px;}
.history.open{display:flex;}
.hist-entry{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.hist-date{font-family:'Space Mono',monospace;font-size:12px;color:var(--plate);margin-bottom:6px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
.hist-ex{font-size:13px;color:var(--smoke);margin:2px 0;}
.hist-ex b{color:var(--chalk);font-weight:600;}
.empty-note{color:var(--smoke);font-size:13px;text-align:center;padding:20px 0;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:20px;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.03em;
  text-transform:uppercase;opacity:0;transition:all .25s ease;pointer-events:none;z-index:50;max-width:80%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.reset-link{display:block;text-align:center;color:var(--smoke);font-size:11.5px;font-family:'Space Mono',monospace;margin-top:26px;text-decoration:underline;cursor:pointer;}
.backup-row{display:flex;justify-content:center;gap:18px;}
.backup-row .reset-link{margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-text">
      <div class="eyebrow">Home Strength Program</div>
      <h1>IRON<span>LOG</span></h1>
      <div class="subhead" id="dateLine">—</div>
      <div class="next-up" id="nextUp"></div>
    </div>
    <div class="header-daruma" id="headerDaruma"></div>
  </div>

  <button class="install-btn" id="installBtn" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13m0 0l-5-5m5 5l5-5M4 21h16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Install App
  </button>

  <div class="quote-card">
    <div class="quote-text" id="quoteText">—</div>
    <div class="quote-shuffle" id="quoteShuffle" title="New quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0115-6.7L21 8M3 22v-6h6M21 12a9 9 0 01-15 6.7L3 16"/></svg>
    </div>
  </div>

  <div class="stats">
    <div class="stat streak">
      <svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.5-2-1-2 1 2 .5 4-2 4a4 4 0 01-4-4c0-3 2-4 2-7-2 1-4 4-4 7a6 6 0 0012 0c0-5-4-6-6-7z"/></svg>
      <div class="num" id="statStreak">0</div>
      <div class="lbl">Day Streak</div>
    </div>
    <div class="stat sessions">
      <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="num" id="statSessions">0</div>
      <div class="lbl">Sessions</div>
    </div>
    <div class="stat week">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="num" id="statWeek">0/3</div>
      <div class="lbl">This Week</div>
    </div>
  </div>

  <div class="heatmap-card">
    <div class="heatmap-title">Training activity — last 14 weeks</div>
    <div class="heatmap-grid" id="heatmap"></div>
    <div class="heatmap-legend">
      Less
      <div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div>
      More
    </div>
  </div>

  <div class="daruma-card">
    <div class="daruma-icon" id="darumaCardIcon"></div>
    <div class="daruma-body" id="darumaBody"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0/0</div>
  </div>

  <div class="list" id="list"></div>

  <div class="actions">
    <button class="btn btn-save" id="saveBtn">Save Session</button>
    <button class="btn btn-history" id="historyBtn">History</button>
  </div>

  <div class="history" id="historyPanel"></div>

  <div class="backup-row">
    <span class="reset-link" id="exportBackup">Export backup</span>
    <span class="reset-link" id="importBackupLabel">Import backup</span>
    <input type="file" id="importBackupFile" accept="application/json" style="display:none;">
  </div>
  <div class="reset-link" id="clearDraft">Clear today's checkmarks</div>
</div>

<div class="toast" id="toast">Saved</div>

<script>
(function(){

// ---------- storage shim: works inside Claude artifacts (window.storage) ----------
// ---------- and also as a plain static file, e.g. hosted on GitHub Pages (localStorage) ----------
const hasCloudStorage = !!(window.storage && window.storage.get);
const storage = {
  async get(key){
    if(hasCloudStorage){
      try{ const r = await window.storage.get(key); return r ? r.value : null; }
      catch(e){ return null; }
    }
    return localStorage.getItem(key);
  },
  async set(key, value){
    if(hasCloudStorage){
      try{ await window.storage.set(key, value); return true; }
      catch(e){ return false; }
    }
    localStorage.setItem(key, value);
    return true;
  }
};

// ---------- program data ----------
const PROGRAM = {
  Sunday: [
    {n:"Push-ups", t:"3 × 8–12"},
    {n:"Decline push-ups", t:"3 × 8–12"},
    {n:"Wide grip push-ups", t:"2 × 10–15"},
    {n:"Archer push-ups", t:"2 × 5–8 per side"},
    {n:"Dumbbell pullover", t:"3 × 10–15"},
    {n:"Dumbbell row", t:"3 × 8–12 per side"},
    {n:"Standing dumbbell overhead press", t:"3 × 8–12"},
    {n:"Rear delt fly", t:"2 × 12–15"},
    {n:"Lateral raises", t:"2 × 12–20"},
    {n:"Dumbbell curl", t:"2 × 8–12"},
    {n:"Hammer curl", t:"2 × 8–12"},
    {n:"Diamond push-ups", t:"2 sets to near-failure"},
    {n:"Dumbbell overhead tricep extension", t:"2 × 10–15"},
    {n:"Goblet squat", t:"3 × 8–12"},
    {n:"Situp", t:"3 × 15–25"}
  ],
  Tuesday: [
    {n:"Weighted push-ups", t:"2 × 8–12"},
    {n:"Weighted decline push-ups", t:"2 × 8–12"},
    {n:"Wide grip push-ups", t:"2 × 10–15"},
    {n:"Dumbbell pullover", t:"2 × 10–15"},
    {n:"Dumbbell row", t:"2 × 8–12 per side"},
    {n:"Standing dumbbell overhead press", t:"2 × 8–12"},
    {n:"Rear delt fly", t:"2 × 12–15"},
    {n:"Lateral raises", t:"2 × 12–20"},
    {n:"Dumbbell curl", t:"2 × 8–12"},
    {n:"Hammer curl", t:"2 × 8–12"},
    {n:"Dumbbell overhead tricep extension", t:"2 × 10–15"},
    {n:"Goblet squat", t:"2 × 8–12"},
    {n:"Situp", t:"2 × 15–25"}
  ],
  Friday: [
    {n:"Weighted push-ups", t:"2 × 8–12"},
    {n:"Wide grip push-ups", t:"2 × 10–15"},
    {n:"Dumbbell row", t:"2 × 8–12 per side"},
    {n:"Standing dumbbell overhead press", t:"2 × 8–12"},
    {n:"Lateral raises", t:"2 × 12–20"},
    {n:"Hammer curl", t:"2 × 8–12"},
    {n:"Diamond push-ups", t:"1–2 sets to near-failure"},
    {n:"Goblet squat", t:"2 × 8–12"},
    {n:"Situp", t:"2 × 15–25"}
  ]
};
const DAYS = ["Sunday","Tuesday","Friday"];
const DAY_INDEX = {Sunday:0, Monday:1, Tuesday:2, Wednesday:3, Thursday:4, Friday:5, Saturday:6};
const SCHEDULED_INDEXES = [0,2,5];
const STREAK_MILESTONES = [3,7,14,21,30,50,75,100,150,200,365];

// ---------- quotes (original lines, not attributed to anyone) ----------
const QUOTES = [
  "Discipline is choosing what you want most over what you want now.",
  "You don't have to be extreme, just consistent.",
  "Every set you finish is a vote for the person you're becoming.",
  "Motivation gets you started. Habit keeps you going.",
  "The body achieves what the mind believes it deserves.",
  "Small reps, done daily, beat huge efforts done rarely.",
  "Nobody regrets the workout they finished.",
  "Progress hides inside the reps you almost skipped.",
  "You're not behind. You're building.",
  "Strength is a habit before it's a body.",
  "Show up even when it's not convenient — that's the whole game.",
  "The hardest set is the one you talk yourself out of.",
  "One more rep than yesterday is still progress.",
  "Consistency turns average effort into extraordinary results.",
  "Today's discomfort is tomorrow's strength.",
  "You don't find motivation. You build it, one session at a time.",
  "The person you want to become is trained, not wished for.",
  "Effort compounds quietly until one day it's obvious.",
  "Act before you feel like it — motivation follows action, not the other way around.",
  "A short workout beats a skipped one, every time.",
  "The mirror lies daily. The log doesn't.",
  "Comfort and growth don't share the same room.",
  "Your only competition is the version of you from last week.",
  "Discipline feels heavy for a moment and light for a lifetime.",
  "Showing up tired still counts.",
  "You are what you repeatedly do, not what you occasionally attempt.",
  "The work you don't want to do is usually the work you need.",
  "Nobody sees the sets that build the streak.",
  "Strong is built in the sessions nobody's watching.",
  "Today is just one more brick. Lay it.",
  "The goblet squat you skip today gets heavier tomorrow.",
  "Fall in love with the process, not just the result.",
  "You're stronger than the excuse you almost used today.",
  "Every checked box is proof you kept your word to yourself.",
  "The streak isn't the point. Who it's turning you into is."
];

function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

// ---------- state ----------
let currentDay = null;
let draft = {};
let history = [];
let historyOpen = false;
let darumaGoal = {text:"", leftFilled:false, rightFilled:false, setDate:null, achievedDate:null};
let darumaHistory = [];
let shuffledQuoteIndex = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function todayDayName(){ return new Date().toLocaleDateString('en-US',{weekday:'long'}); }

function emptyDraftFor(day){
  const exObj = {};
  PROGRAM[day].forEach(ex => exObj[ex.n] = {done:false, weight:"", reps:""});
  return {todayDate: todayStr(), exercises: exObj};
}

function parseWeight(w){
  if(!w) return null;
  const m = String(w).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}

function lastLoggedFor(day, name){
  for(let i=history.length-1;i>=0;i--){
    const h = history[i];
    if(h.day !== day) continue;
    const found = h.exercises.find(e => e.name === name && (e.weight || e.reps));
    if(found) return found;
  }
  return null;
}

function maxWeightFor(day, name){
  let max = null;
  history.forEach(h => {
    if(h.day !== day) return;
    const ex = h.exercises.find(e => e.name === name);
    if(ex){
      const w = parseWeight(ex.weight);
      if(w !== null && (max === null || w > max)) max = w;
    }
  });
  return max;
}

// ---------- stats ----------
function loggedDates(){
  return new Set(history.filter(h => h.exercises.some(e=>e.done)).map(h => h.date));
}
function computeStreak(){
  const active = loggedDates();
  if(active.size === 0) return 0;
  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  if(!active.has(cursor.toISOString().slice(0,10))) cursor.setDate(cursor.getDate()-1);
  while(active.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function computeTotalSessions(){
  return history.filter(h => h.exercises.some(e=>e.done)).length;
}
function computeWeekCompletion(){
  const now = new Date();
  const dow = now.getDay();
  const sunday = new Date(now);
  sunday.setDate(now.getDate()-dow);
  sunday.setHours(0,0,0,0);
  const active = loggedDates();
  let count = 0;
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    if(d > now) continue;
    if(active.has(d.toISOString().slice(0,10))) count++;
  }
  return count;
}
function renderStats(){
  document.getElementById('statStreak').textContent = computeStreak();
  document.getElementById('statSessions').textContent = computeTotalSessions();
  document.getElementById('statWeek').textContent = computeWeekCompletion() + '/3';
}

function renderNextUp(){
  const el = document.getElementById('nextUp');
  const todayIdx = new Date().getDay();
  if(SCHEDULED_INDEXES.includes(todayIdx)){
    el.innerHTML = `<b>Workout day</b> — today's session is ${todayDayName()}. Let's go.`;
    return;
  }
  let daysAhead = 1;
  let idx = (todayIdx+1)%7;
  while(!SCHEDULED_INDEXES.includes(idx)){ idx = (idx+1)%7; daysAhead++; }
  const names = Object.keys(DAY_INDEX);
  const nextName = names.find(n => DAY_INDEX[n]===idx);
  el.innerHTML = `Rest day — next session is <b>${nextName}</b> (in ${daysAhead} day${daysAhead>1?'s':''}).`;
}

// ---------- quotes ----------
function renderQuote(){
  const idx = shuffledQuoteIndex !== null ? shuffledQuoteIndex : (hashStr(todayStr()) % QUOTES.length);
  document.getElementById('quoteText').textContent = '“' + QUOTES[idx] + '”';
}
document.getElementById('quoteShuffle').onclick = () => {
  let idx;
  do { idx = Math.floor(Math.random()*QUOTES.length); } while(QUOTES.length>1 && idx === shuffledQuoteIndex);
  shuffledQuoteIndex = idx;
  renderQuote();
};

// ---------- daruma icon ----------

  const rightEye = rightFilled ? '#15171c' : '#edeae2';

  <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <ellipse cx="50" cy="70" rx="42" ry="46" fill="#c8452b"/>
    <ellipse cx="50" cy="70" rx="42" ry="46" fill="none" stroke="#8a2e1c" stroke-width="2"/>
    <path d="M12 78 C12 100 30 114 50 114 C70 114 88 100 88 78 Z" fill="#d6502f"/>
    <ellipse cx="50" cy="46" rx="29" ry="25" fill="#f2ede2"/>

    <!-- furrowed angry brows -->
    <path d="M19 36 L41 46" fill="none" stroke="#15171c" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M81 36 L59 46" fill="none" stroke="#15171c" stroke-width="5.5" stroke-linecap="round"/>
    <!-- anger crease -->
    <path d="M46 34 L50 40 L46 40 M54 34 L50 40 L54 40" fill="none" stroke="#8a2e1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- narrowed, filled-on-achieve eyes -->
    <ellipse cx="38" cy="49" rx="7.5" ry="5.5" fill="${leftEye}" stroke="#15171c" stroke-width="2.5"/>
    <ellipse cx="62" cy="49" rx="7.5" ry="5.5" fill="${rightEye}" stroke="#15171c" stroke-width="2.5"/>

    <!-- fierce mustache -->
    <path d="M20 60 C27 56 33 62 37 58" fill="none" stroke="#15171c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M80 60 C73 56 67 62 63 58" fill="none" stroke="#15171c" stroke-width="3.5" stroke-linecap="round"/>

    <!-- firm downturned frown -->
    <path d="M40 68 Q50 60 60 68" fill="none" stroke="#15171c" stroke-width="3.5" stroke-linecap="round"/>

    <circle cx="50" cy="88" r="15" fill="none" stroke="#e8b93f" stroke-width="2"/>
    <text x="50" y="94" text-anchor="middle" font-size="16" font-family="serif" fill="#e8b93f">力</text>
  </svg>`;
}
function renderDarumaIcons(){
  document.getElementById('headerDaruma').innerHTML = darumaSVG(darumaGoal.leftFilled, darumaGoal.rightFilled);
  document.getElementById('darumaCardIcon').innerHTML = darumaSVG(darumaGoal.leftFilled, darumaGoal.rightFilled);
}

function renderDarumaBody(){
  const body = document.getElementById('darumaBody');
  if(!darumaGoal.leftFilled){
    body.innerHTML = `
      <div class="daruma-title">Set your Daruma goal</div>
      <div class="daruma-sub">Write down what you're working toward. Filling the left eye locks it in — the right eye stays blank until you've earned it.</div>
      <input type="text" class="daruma-input" id="darumaInput" placeholder="e.g. Get in the best shape of my life" value="${darumaGoal.text || ''}">
      <button class="daruma-btn left" id="darumaSetBtn">Set Goal — Fill Left Eye</button>
    `;
    document.getElementById('darumaSetBtn').onclick = async () => {
      const val = document.getElementById('darumaInput').value.trim();
      if(!val) return;
      darumaGoal.text = val;
      darumaGoal.leftFilled = true;
      darumaGoal.setDate = todayStr();
      await persistDaruma();
      renderDarumaIcons();
      renderDarumaBody();
      showToast('Left eye filled — now go earn the right one.');
    };
  } else if(darumaGoal.leftFilled && !darumaGoal.rightFilled){
    body.innerHTML = `
      <div class="daruma-title">Working toward</div>
      <div class="daruma-goal-text">${darumaGoal.text}</div>
      <div class="daruma-sub">Left eye filled ${darumaGoal.setDate ? 'on '+darumaGoal.setDate : ''}. When you've actually achieved it, fill the right eye.</div>
      <button class="daruma-btn right" id="darumaAchieveBtn">Mark Achieved — Fill Right Eye</button>
    `;
    document.getElementById('darumaAchieveBtn').onclick = async () => {
      darumaGoal.rightFilled = true;
      darumaGoal.achievedDate = todayStr();
      darumaHistory.push({text:darumaGoal.text, setDate:darumaGoal.setDate, achievedDate:darumaGoal.achievedDate});
      await persistDaruma();
      await persistDarumaHistory();
      renderDarumaIcons();
      renderDarumaBody();
      celebrate();
      showToast('Goal achieved. Both eyes filled.');
    };
  } else {
    body.innerHTML = `
      <div class="daruma-title">Goal achieved</div>
      <div class="daruma-goal-text">${darumaGoal.text}</div>
      <div class="daruma-sub">Achieved ${darumaGoal.achievedDate}. Tradition says it's time to retire this daruma and start a new one.</div>
      <button class="daruma-btn reset" id="darumaNewBtn">Start New Daruma</button>
      ${darumaHistory.length ? `<div class="daruma-history">${darumaHistory.slice().reverse().map(h=>`<div class="daruma-history-item">✓ <b>${h.text}</b> — ${h.achievedDate}</div>`).join('')}</div>` : ''}
    `;
    document.getElementById('darumaNewBtn').onclick = async () => {
      darumaGoal = {text:"", leftFilled:false, rightFilled:false, setDate:null, achievedDate:null};
      await persistDaruma();
      renderDarumaIcons();
      renderDarumaBody();
    };
  }
}

// ---------- heatmap ----------
function renderHeatmap(){
  const el = document.getElementById('heatmap');
  el.innerHTML = "";
  const dayMap = {};
  history.forEach(h => {
    if(!dayMap[h.date]) dayMap[h.date] = {done:0, total:0};
    dayMap[h.date].done += h.exercises.filter(e=>e.done).length;
    dayMap[h.date].total += h.exercises.length;
  });
  const totalDays = 98;
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - (totalDays-1));
  start.setDate(start.getDate() - start.getDay());
  const todayIso = todayStr();
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const iso = d.toISOString().slice(0,10);
    const cell = document.createElement('div');
    cell.className = 'hm-cell';
    if(d > end){
      cell.style.visibility = 'hidden';
    } else {
      const rec = dayMap[iso];
      if(rec && rec.total > 0){
        const ratio = rec.done / rec.total;
        if(ratio >= 1) cell.classList.add('l3');
        else if(ratio >= 0.5) cell.classList.add('l2');
        else if(ratio > 0) cell.classList.add('l1');
      }
      cell.title = rec ? `${iso} — ${rec.done}/${rec.total} completed` : `${iso} — no session`;
    }
    if(iso === todayIso) cell.classList.add('today');
    el.appendChild(cell);
  }
}

// ---------- render ----------
function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = "";
  DAYS.forEach(day => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (day===currentDay?' active':'') + (day===todayDayName()?' today':'');
    btn.dataset.day = day;
    btn.innerHTML = `<span class="dot"></span>${day}`;
    btn.onclick = () => { currentDay = day; renderDayView(); };
    tabsEl.appendChild(btn);
  });
}

function renderList(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = "";
  const dayDraft = draft[currentDay];
  let doneCount = 0;

  PROGRAM[currentDay].forEach(ex => {
    const state = dayDraft.exercises[ex.n];
    if(state.done) doneCount++;
    const last = lastLoggedFor(currentDay, ex.n);
    const prevMax = maxWeightFor(currentDay, ex.n);
    const curWeight = parseWeight(state.weight);
    const isPR = curWeight !== null && prevMax !== null && curWeight > prevMax;

    const row = document.createElement('div');
    row.className = 'ex' + (state.done ? ' done' : '');

    row.innerHTML = `
      <div class="ex-top">
        <div class="checkbox">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#15171c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <div class="ex-name-row">
            <div class="ex-name">${ex.n}</div>
            ${isPR ? '<span class="pr-chip">PR</span>' : ''}
          </div>
          <div class="ex-target">${ex.t}</div>
        </div>
      </div>
      <div class="ex-fields">
        <div class="field">
          <label>Weight used</label>
          <input type="text" inputmode="decimal" placeholder="${last && last.weight ? last.weight+' lb last time' : 'e.g. 25 lb'}" value="${state.weight}" data-field="weight">
        </div>
        <div class="field">
          <label>Reps done</label>
          <input type="text" placeholder="${last && last.reps ? last.reps+' last time' : 'e.g. 12,10,9'}" value="${state.reps}" data-field="reps">
        </div>
      </div>
    `;

    row.querySelector('.ex-top').onclick = () => {
      state.done = !state.done;
      persistDraft();
      renderList();
    };
    row.querySelectorAll('.ex-fields input').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('input', e => {
        state[e.target.dataset.field] = e.target.value;
        persistDraft();
        renderList();
      });
    });

    listEl.appendChild(row);
  });

  renderProgress(doneCount);
}

function renderProgress(doneCountArg){
  const total = PROGRAM[currentDay].length;
  let doneCount = doneCountArg;
  if(doneCount === undefined){
    doneCount = Object.values(draft[currentDay].exercises).filter(e=>e.done).length;
  }
  const fill = document.getElementById('progressFill');
  fill.style.width = (total ? (doneCount/total*100) : 0) + '%';
  fill.classList.toggle('full', doneCount === total && total > 0);
  document.getElementById('progressLabel').textContent = `${doneCount}/${total}`;
}

function renderHistory(){
  const panel = document.getElementById('historyPanel');
  panel.innerHTML = "";
  const relevant = history.filter(h => h.day === currentDay).slice().reverse();
  if(relevant.length === 0){
    panel.innerHTML = `<div class="empty-note">No saved ${currentDay} sessions yet.</div>`;
    return;
  }
  relevant.forEach(h => {
    const entry = document.createElement('div');
    entry.className = 'hist-entry';
    const loggedEx = h.exercises.filter(e => e.done || e.weight || e.reps);
    entry.innerHTML = `<div class="hist-date"><span>${h.date} — ${loggedEx.filter(e=>e.done).length}/${h.exercises.length} completed</span></div>` +
      loggedEx.map(e => `<div class="hist-ex"><b>${e.name}</b>${e.weight?` — ${e.weight} lb`:''}${e.reps?` — ${e.reps} reps`:''}</div>`).join('');
    panel.appendChild(entry);
  });
}

function renderDayView(){
  renderTabs();
  renderList();
  if(historyOpen) renderHistory();
}

function renderAll(){
  document.getElementById('dateLine').textContent =
    new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  renderNextUp();
  renderQuote();
  renderStats();
  renderHeatmap();
  renderDarumaIcons();
  renderDarumaBody();
  renderDayView();
}

// ---------- persistence ----------
async function persistDraft(){ await storage.set('workout-draft', JSON.stringify(draft)); }
async function persistHistory(){ await storage.set('workout-history', JSON.stringify(history)); }
async function persistDaruma(){ await storage.set('daruma-goal', JSON.stringify(darumaGoal)); }
async function persistDarumaHistory(){ await storage.set('daruma-history', JSON.stringify(darumaHistory)); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function celebrate(){
  const colors = ['#e0562f','#4fa98c','#5c7cfa','#e8b93f','#edeae2'];
  for(let i=0;i<26;i++){
    const el = document.createElement('div');
    el.style.position = 'fixed';
    el.style.left = '50%'; el.style.top = '45%';
    el.style.width = '6px'; el.style.height = '6px';
    el.style.background = colors[i % colors.length];
    el.style.borderRadius = '50%';
    el.style.pointerEvents = 'none';
    el.style.zIndex = 999;
    document.body.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*140;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist - 40;
    const anim = el.animate([
      {transform:'translate(-50%,-50%) scale(1)', opacity:1},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity:0}
    ], {duration:700+Math.random()*450, easing:'cubic-bezier(.2,.8,.2,1)'});
    anim.onfinish = () => el.remove();
  }
}

async function init(){
  const savedHistory = await storage.get('workout-history');
  history = savedHistory ? JSON.parse(savedHistory) : [];

  const savedDraft = await storage.get('workout-draft');
  draft = savedDraft ? JSON.parse(savedDraft) : {};

  const savedDaruma = await storage.get('daruma-goal');
  darumaGoal = savedDaruma ? JSON.parse(savedDaruma) : {text:"", leftFilled:false, rightFilled:false, setDate:null, achievedDate:null};

  const savedDarumaHistory = await storage.get('daruma-history');
  darumaHistory = savedDarumaHistory ? JSON.parse(savedDarumaHistory) : [];

  DAYS.forEach(day => {
    if(!draft[day] || draft[day].todayDate !== todayStr()){
      draft[day] = emptyDraftFor(day);
    }
  });
  await persistDraft();

  currentDay = DAYS.includes(todayDayName()) ? todayDayName() : "Sunday";
  renderAll();
}

document.getElementById('saveBtn').onclick = async () => {
  const dayDraft = draft[currentDay];
  const exercisesLog = PROGRAM[currentDay].map(ex => ({
    name: ex.n,
    done: dayDraft.exercises[ex.n].done,
    weight: dayDraft.exercises[ex.n].weight,
    reps: dayDraft.exercises[ex.n].reps
  }));
  const doneCount = exercisesLog.filter(e=>e.done).length;
  const total = exercisesLog.length;

  const existingIdx = history.findIndex(h => h.date === todayStr() && h.day === currentDay);
  const entry = {date: todayStr(), day: currentDay, exercises: exercisesLog};
  if(existingIdx >= 0) history[existingIdx] = entry;
  else history.push(entry);

  await persistHistory();

  const newStreak = computeStreak();
  if(STREAK_MILESTONES.includes(newStreak)){
    showToast(`${newStreak}-day streak — milestone reached`);
    celebrate();
  } else {
    showToast(`Saved — ${doneCount}/${total} done`);
    if(doneCount === total && total > 0) celebrate();
  }

  renderStats();
  renderHeatmap();
  renderList();
  if(historyOpen) renderHistory();
};

document.getElementById('historyBtn').onclick = () => {
  historyOpen = !historyOpen;
  const panel = document.getElementById('historyPanel');
  panel.classList.toggle('open', historyOpen);
  document.getElementById('historyBtn').textContent = historyOpen ? 'Hide History' : 'History';
  if(historyOpen) renderHistory();
};

document.getElementById('clearDraft').onclick = async () => {
  draft[currentDay] = emptyDraftFor(currentDay);
  await persistDraft();
  renderList();
  showToast('Cleared');
};

init();
})();
</script>
